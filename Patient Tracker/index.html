<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">🏥</span>
                Patient Tracker
            </div>
            <div class="nav-links">
                <button class="nav-btn active" onclick="showPage('home')">Home</button>
                <button class="nav-btn" onclick="showPage('results')">All Applications</button>
            </div>
        </div>
    </nav>

    <!-- Home Page -->
    <div id="homePage" class="page active">
        <div class="container">
            <div class="header">
                <h1>Patient Application Tracker</h1>
                <p>Manage and track patient applications efficiently</p>
            </div>

            <div class="content">
                <!-- Stats Dashboard -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalCount">0</div>
                        <div class="stat-label">Total Applications</div>
                    </div>
                    <div class="stat-card pending">
                        <div class="stat-number" id="pendingCount">0</div>
                        <div class="stat-label">Pending</div>
                    </div>
                    <div class="stat-card approved">
                        <div class="stat-number" id="approvedCount">0</div>
                        <div class="stat-label">Approved</div>
                    </div>
                    <div class="stat-card rejected">
                        <div class="stat-number" id="rejectedCount">0</div>
                        <div class="stat-label">Rejected</div>
                    </div>
                </div>

                <!-- Form Section -->
                <div class="form-section">
                    <h2>Add New Application</h2>
                    <form id="applicationForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="patientName">Patient Name *</label>
                                <input type="text" id="patientName" required placeholder="Enter patient name">
                            </div>
                            <div class="form-group">
                                <label for="patientEmail">Email *</label>
                                <input type="email" id="patientEmail" required placeholder="Enter email">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="patientPhone">Phone *</label>
                                <input type="tel" id="patientPhone" required placeholder="Enter phone number">
                            </div>
                            <div class="form-group">
                                <label for="applicationDate">Application Date *</label>
                                <input type="date" id="applicationDate" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="serviceType">Service Type *</label>
                                <select id="serviceType" required>
                                    <option value="">Select a service</option>
                                    <option value="Consultation">Consultation</option>
                                    <option value="Surgery">Surgery</option>
                                    <option value="Checkup">Checkup</option>
                                    <option value="Therapy">Therapy</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="priority">Priority Level</label>
                                <select id="priority">
                                    <option value="Low">Low</option>
                                    <option value="Medium" selected>Medium</option>
                                    <option value="High">High</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn-submit">Add Application</button>
                    </form>
                </div>

                <!-- Search section -->
                <div class="search-section">
                    <input type="text" id="searchInput" placeholder="Search by patient name..." class="search-input">
                    <select id="filterStatus" class="filter-select">
                        <option value="">All Status</option>
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>

                <!-- Applications List Section -->
                <div class="applications-section">
                    <h2>Recent Applications</h2>
                    <div id="applicationsList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Results/Views Page -->
    <div id="resultsPage" class="page">
        <div class="container">
            <div class="header">
                <h1>All Applications</h1>
                <p>View and manage all patient applications</p>
            </div>

            <div class="content">
                <div class="results-controls">
                    <input type="text" id="resultsSearchInput" placeholder="Search by patient name..." class="search-input">
                    <select id="resultsFilterStatus" class="filter-select">
                        <option value="">All Status</option>
                        <option value="Pending">Pending</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                    <select id="resultsFilterPriority" class="filter-select">
                        <option value="">All Priority</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div class="results-view">
                    <div id="resultsList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Patient Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeDetailModal()">&times;</span>
            <div id="detailContent"></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Application</h2>
            <form id="editForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="editPatientName">Patient Name</label>
                        <input type="text" id="editPatientName" required>
                    </div>
                    <div class="form-group">
                        <label for="editPatientEmail">Email</label>
                        <input type="email" id="editPatientEmail" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editPatientPhone">Phone</label>
                        <input type="tel" id="editPatientPhone" required>
                    </div>
                    <div class="form-group">
                        <label for="editApplicationDate">Application Date</label>
                        <input type="date" id="editApplicationDate" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="editServiceType">Service Type</label>
                        <select id="editServiceType" required>
                            <option value="Consultation">Consultation</option>
                            <option value="Surgery">Surgery</option>
                            <option value="Checkup">Checkup</option>
                            <option value="Therapy">Therapy</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editPriority">Priority Level</label>
                        <select id="editPriority">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-save">Save Changes</button>
                    <button type="button" class="btn-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script> 
    // Initialize applications array from localStorage
let applications = JSON.parse(localStorage.getItem("applications")) || []
let editingId = null

// Set today's date as default
document.getElementById("applicationDate").valueAsDate = new Date()

function showPage(pageName) {
  // Hide all pages
  document.querySelectorAll(".page").forEach((page) => {
    page.classList.remove("active")
  })

  // Remove active class from all nav buttons
  document.querySelectorAll(".nav-btn").forEach((btn) => {
    btn.classList.remove("active")
  })

  // Show selected page
  document.getElementById(pageName + "Page").classList.add("active")

  // Add active class to clicked button
  event.target.classList.add("active")

  // Render appropriate content
  if (pageName === "results") {
    renderResults()
  } else {
    renderApplications()
    updateStats()
  }
}

// Form submission
document.getElementById("applicationForm").addEventListener("submit", function (e) {
  e.preventDefault()

  const newApplication = {
    id: Date.now(),
    name: document.getElementById("patientName").value,
    email: document.getElementById("patientEmail").value,
    phone: document.getElementById("patientPhone").value,
    date: document.getElementById("applicationDate").value,
    service: document.getElementById("serviceType").value,
    priority: document.getElementById("priority").value,
    status: "Pending",
    createdAt: new Date().toISOString(),
    history: [],
  }

  applications.push(newApplication)
  saveApplications()
  renderApplications()
  updateStats()
  this.reset()
  document.getElementById("applicationDate").valueAsDate = new Date()
})

document.getElementById("searchInput").addEventListener("input", renderApplications)
document.getElementById("filterStatus").addEventListener("change", renderApplications)

document.getElementById("resultsSearchInput").addEventListener("input", renderResults)
document.getElementById("resultsFilterStatus").addEventListener("change", renderResults)
document.getElementById("resultsFilterPriority").addEventListener("change", renderResults)

const modal = document.getElementById("editModal")
const closeBtn = document.querySelector(".close")
const editForm = document.getElementById("editForm")

closeBtn.addEventListener("click", closeModal)
window.addEventListener("click", (e) => {
  if (e.target === modal) closeModal()
})

document.querySelector(".btn-cancel").addEventListener("click", closeModal)

editForm.addEventListener("submit", (e) => {
  e.preventDefault()

  const app = applications.find((a) => a.id === editingId)
  if (app) {
    app.name = document.getElementById("editPatientName").value
    app.email = document.getElementById("editPatientEmail").value
    app.phone = document.getElementById("editPatientPhone").value
    app.date = document.getElementById("editApplicationDate").value
    app.service = document.getElementById("editServiceType").value
    app.priority = document.getElementById("editPriority").value

    saveApplications()
    renderApplications()
    renderResults()
    updateStats()
    closeModal()
  }
})

function openEditModal(id) {
  const app = applications.find((a) => a.id === id)
  if (app) {
    editingId = id
    document.getElementById("editPatientName").value = app.name
    document.getElementById("editPatientEmail").value = app.email
    document.getElementById("editPatientPhone").value = app.phone
    document.getElementById("editApplicationDate").value = app.date
    document.getElementById("editServiceType").value = app.service
    document.getElementById("editPriority").value = app.priority || "Medium"
    document.getElementById("editNotes").value = app.notes || ""
    modal.style.display = "block"
  }
}

function closeModal() {
  modal.style.display = "none"
  editingId = null
}

function openDetailModal(id) {
  const app = applications.find((a) => a.id === id)
  if (app) {
    const detailModal = document.getElementById("detailModal")
    const detailContent = document.getElementById("detailContent")

    const formattedDate = new Date(app.date).toLocaleDateString("en-US", {
      year: "numeric",
      month: "long",
      day: "numeric",
    })

    const createdDate = new Date(app.createdAt).toLocaleDateString("en-US", {
      year: "numeric",
      month: "long",
      day: "numeric",
    })

    detailContent.innerHTML = `
      <div class="detail-header">
        <h2>${app.name}</h2>
        <p>Application ID: ${app.id}</p>
      </div>

      <div class="detail-grid">
        <div class="detail-section">
          <h3>Contact Information</h3>
          <div class="detail-item">
            <div class="detail-label">Email</div>
            <div class="detail-value">${app.email}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Phone</div>
            <div class="detail-value">${app.phone}</div>
          </div>
        </div>

        <div class="detail-section">
          <h3>Application Details</h3>
          <div class="detail-item">
            <div class="detail-label">Service Type</div>
            <div class="detail-value">${app.service}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Application Date</div>
            <div class="detail-value">${formattedDate}</div>
          </div>
        </div>

        <div class="detail-section">
          <h3>Status & Priority</h3>
          <div class="detail-item">
            <div class="detail-label">Status</div>
            <div class="detail-value">
              <span class="status-badge status-${app.status.toLowerCase()}">${app.status}</span>
            </div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Priority</div>
            <div class="detail-value">
              <span class="priority-badge priority-${(app.priority || "Medium").toLowerCase()}">${app.priority || "Medium"}</span>
            </div>
          </div>
        </div>

        <div class="detail-section">
          <h3>Timeline</h3>
          <div class="detail-item">
            <div class="detail-label">Created</div>
            <div class="detail-value">${createdDate}</div>
          </div>
        </div>
      </div>

      <div class="detail-actions">
        <button class="btn-detail btn-detail-primary" onclick="openEditModal(${app.id}); closeDetailModal()">Edit Application</button>
        ${app.status !== "Approved" ? `<button class="btn-detail btn-detail-primary" onclick="updateStatus(${app.id}, 'Approved'); closeDetailModal()">Approve</button>` : ""}
        ${app.status !== "Rejected" ? `<button class="btn-detail btn-detail-primary" onclick="updateStatus(${app.id}, 'Rejected'); closeDetailModal()">Reject</button>` : ""}
        ${app.status !== "Pending" ? `<button class="btn-detail btn-detail-primary" onclick="updateStatus(${app.id}, 'Pending'); closeDetailModal()">Mark Pending</button>` : ""}
        <button class="btn-detail btn-detail-secondary" onclick="closeDetailModal()">Close</button>
      </div>
    `

    detailModal.style.display = "block"
  }
}

function closeDetailModal() {
  document.getElementById("detailModal").style.display = "none"
}

window.addEventListener("click", (e) => {
  const detailModal = document.getElementById("detailModal")
  if (e.target === detailModal) closeDetailModal()
})

function renderApplications() {
  const listContainer = document.getElementById("applicationsList")
  const searchTerm = document.getElementById("searchInput").value.toLowerCase()
  const filterStatus = document.getElementById("filterStatus").value

  const filteredApplications = applications
    .filter((app) => {
      const matchesSearch = app.name.toLowerCase().includes(searchTerm)
      const matchesStatus = !filterStatus || app.status === filterStatus
      return matchesSearch && matchesStatus
    })
    .slice(0, 5) // Show only 5 recent applications on home page

  if (filteredApplications.length === 0) {
    listContainer.innerHTML = '<div class="empty-state"><p>No applications found. Add one to get started!</p></div>'
    return
  }

  listContainer.innerHTML = filteredApplications
    .map(
      (app) => `
        <div class="application-card">
            <div class="app-info">
                <h3>${app.name}</h3>
                <p><strong>Email:</strong> ${app.email}</p>
                <p><strong>Phone:</strong> ${app.phone}</p>
                <p><strong>Service:</strong> ${app.service}</p>
                <p><strong>Date:</strong> ${new Date(app.date).toLocaleDateString()}</p>
                <span class="status-badge status-${app.status.toLowerCase()}">${app.status}</span>
                <span class="priority-badge priority-${(app.priority || "Medium").toLowerCase()}">${app.priority || "Medium"}</span>
            </div>
            <div class="app-actions">
                <button class="btn-small btn-view" onclick="openDetailModal(${app.id})">View Details</button>
                <button class="btn-small btn-edit" onclick="openEditModal(${app.id})">Edit</button>
                <button class="btn-small btn-delete" onclick="deleteApplication(${app.id})">Delete</button>
            </div>
        </div>
    `,
    )
    .join("")
}

function renderResults() {
  const listContainer = document.getElementById("resultsList")
  const searchTerm = document.getElementById("resultsSearchInput").value.toLowerCase()
  const filterStatus = document.getElementById("resultsFilterStatus").value
  const filterPriority = document.getElementById("resultsFilterPriority").value

  const filteredApplications = applications.filter((app) => {
    const matchesSearch = app.name.toLowerCase().includes(searchTerm)
    const matchesStatus = !filterStatus || app.status === filterStatus
    const matchesPriority = !filterPriority || (app.priority || "Medium") === filterPriority
    return matchesSearch && matchesStatus && matchesPriority
  })

  if (filteredApplications.length === 0) {
    listContainer.innerHTML = '<div class="empty-state"><p>No applications found.</p></div>'
    return
  }

  listContainer.innerHTML = filteredApplications
    .map(
      (app) => `
        <div class="application-card">
            <div class="app-info">
                <h3>${app.name}</h3>
                <p><strong>Email:</strong> ${app.email}</p>
                <p><strong>Phone:</strong> ${app.phone}</p>
                <p><strong>Service:</strong> ${app.service}</p>
                <p><strong>Date:</strong> ${new Date(app.date).toLocaleDateString()}</p>
                <span class="status-badge status-${app.status.toLowerCase()}">${app.status}</span>
                <span class="priority-badge priority-${(app.priority || "Medium").toLowerCase()}">${app.priority || "Medium"}</span>
            </div>
            <div class="app-actions">
                <button class="btn-small btn-view" onclick="openDetailModal(${app.id})">View Details</button>
                <button class="btn-small btn-edit" onclick="openEditModal(${app.id})">Edit</button>
                <button class="btn-small btn-delete" onclick="deleteApplication(${app.id})">Delete</button>
            </div>
        </div>
    `,
    )
    .join("")
}

function updateStats() {
  const total = applications.length
  const pending = applications.filter((a) => a.status === "Pending").length
  const approved = applications.filter((a) => a.status === "Approved").length
  const rejected = applications.filter((a) => a.status === "Rejected").length

  document.getElementById("totalCount").textContent = total
  document.getElementById("pendingCount").textContent = pending
  document.getElementById("approvedCount").textContent = approved
  document.getElementById("rejectedCount").textContent = rejected
}

// Update application status
function updateStatus(id, newStatus) {
  const app = applications.find((a) => a.id === id)
  if (app) {
    app.status = newStatus
    if (!app.history) app.history = []
    app.history.push({
      status: newStatus,
      date: new Date().toISOString(),
    })
    saveApplications()
    renderApplications()
    renderResults()
    updateStats()
  }
}

// Delete application
function deleteApplication(id) {
  if (confirm("Are you sure you want to delete this application?")) {
    applications = applications.filter((a) => a.id !== id)
    saveApplications()
    renderApplications()
    renderResults()
    updateStats()
  }
}

// Save to localStorage
function saveApplications() {
  localStorage.setItem("applications", JSON.stringify(applications))
}

// Initial render
renderApplications()
updateStats()

    </script>
</body>
</html>
