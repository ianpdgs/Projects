<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Properties - Cyboard</title>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">Cyboard</h1>
            <!-- Updated navigation to use nav element with ul for auth integration -->
            <nav>
                <ul class="nav">
                    <li><a href="home.html" class="nav-link">Home</a></li>
                    <li><a href="properties.html" class="nav-link active">Properties</a></li>
                    <li><a href="#about" class="nav-link">About</a></li>
                    <li><a href="#contact" class="nav-link">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="properties-header">
            <div class="container">
                <h1>Available Properties</h1>
                <p>Find the perfect boarding house that suits your needs and budget</p>
            </div>
        </section>

        <section class="filters">
            <div class="container">
                <div class="filter-bar">
                    <div class="filter-group">
                        <select id="location-filter">
                            <option value="">All Locations</option>
                            <option value="jaro">Jaro</option>
                            <option value="la-paz">La Paz</option>
                            <option value="mandurriao">Mandurriao</option>
                            <option value="city-proper">City Proper</option>
                            <option value="molo">Molo</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select id="price-filter">
                            <option value="">All Prices</option>
                            <option value="2000">Under ₱2,000</option>
                            <option value="3000">Under ₱3,000</option>
                            <option value="4000">Under ₱4,000</option>
                            <option value="5000">₱5,000+</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select id="type-filter">
                            <option value="">All Types</option>
                            <option value="Studio">Studio</option>
                            <option value="Shared">Shared Room</option>
                            <option value="Private">Private Room</option>
                            <option value="Apartment">Apartment</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <!-- Updated properties section to load from database -->
        <section class="properties-grid">
            <div class="container">
                <div class="properties-list" id="propertiesList">
                    <!-- Properties will be loaded dynamically -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Cyboard. All rights reserved. | Find your perfect boarding house in Iloilo City</p>
        </div>
    </footer>

    <!-- Added auth.js script and properties loading functionality -->
    <script src="js/auth.js"></script>
    <script>
        // Load properties from database
        function loadProperties() {
            const properties = auth.getAllProperties();
            const propertiesList = document.getElementById('propertiesList');
            
            if (properties.length === 0) {
                propertiesList.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No properties available at the moment.</p>';
                return;
            }
            
            propertiesList.innerHTML = properties.map(property => `
                <div class="property-card">
                    <div class="property-image">
                        <img src="${property.image}" alt="${property.title}">
                    </div>
                    <div class="property-info">
                        <h3>${property.title}</h3>
                        <p class="property-location">📍 ${property.location}</p>
                        <p class="property-description">Comfortable ${property.type.toLowerCase()} with great amenities in a prime location.</p>
                        <div class="property-features">
                            ${property.amenities.map(amenity => `<span class="feature-tag">${amenity}</span>`).join('')}
                        </div>
                        <div class="property-footer">
                            <span class="property-price">₱${property.price.toLocaleString()}/month</span>
                            <button class="contact-btn" onclick="contactOwner('${property.title}')">Contact Owner</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // Contact owner function
        function contactOwner(propertyTitle) {
            if (auth.isLoggedIn()) {
                showMessage(`Contact information for "${propertyTitle}" would be provided here.`, 'info');
            } else {
                showMessage('Please login to contact property owners.', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            }
        }
        
        // Filter functionality
        function setupFilters() {
            const locationFilter = document.getElementById('location-filter');
            const priceFilter = document.getElementById('price-filter');
            const typeFilter = document.getElementById('type-filter');
            
            [locationFilter, priceFilter, typeFilter].forEach(filter => {
                filter.addEventListener('change', filterProperties);
            });
        }
        
        function filterProperties() {
            const locationValue = document.getElementById('location-filter').value.toLowerCase();
            const priceValue = parseInt(document.getElementById('price-filter').value) || Infinity;
            const typeValue = document.getElementById('type-filter').value;
            
            const properties = auth.getAllProperties();
            const filteredProperties = properties.filter(property => {
                const matchesLocation = !locationValue || property.location.toLowerCase().includes(locationValue);
                const matchesPrice = property.price <= priceValue;
                const matchesType = !typeValue || property.type === typeValue;
                
                return matchesLocation && matchesPrice && matchesType;
            });
            
            const propertiesList = document.getElementById('propertiesList');
            
            if (filteredProperties.length === 0) {
                propertiesList.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No properties match your filters.</p>';
                return;
            }
            
            propertiesList.innerHTML = filteredProperties.map(property => `
                <div class="property-card">
                    <div class="property-image">
                        <img src="${property.image}" alt="${property.title}">
                    </div>
                    <div class="property-info">
                        <h3>${property.title}</h3>
                        <p class="property-location">📍 ${property.location}</p>
                        <p class="property-description">Comfortable ${property.type.toLowerCase()} with great amenities in a prime location.</p>
                        <div class="property-features">
                            ${property.amenities.map(amenity => `<span class="feature-tag">${amenity}</span>`).join('')}
                        </div>
                        <div class="property-footer">
                            <span class="property-price">₱${property.price.toLocaleString()}/month</span>
                            <button class="contact-btn" onclick="contactOwner('${property.title}')">Contact Owner</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            if (!auth.isLoggedIn()) {
                showMessage('Please login to access properties.', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return;
            }
            loadProperties();
            setupFilters();
        });
    </script>
</body>
</html>
